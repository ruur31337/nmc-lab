{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Reset Password</h1>
      <p>Enter your registered email address and we'll send you a reset link.</p>
    </div>

    <div id="msg" class="alert" style="display:none;"></div>

    <form id="forgot-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="yourname@nmc.local" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="forgot-btn">
        Send Reset Link
      </button>
    </form>

    <div class="auth-footer">
      <a href="/login">Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('forgot-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn  = document.getElementById('forgot-btn');
  const msg  = document.getElementById('msg');
  const email = document.getElementById('email').value.trim();

  btn.disabled    = true;
  btn.textContent = 'Sending…';
  msg.style.display = 'none';

  try {
    const res  = await fetch('/api/v2/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();

    msg.textContent = data.message || 'If an account exists with that email, a reset link has been sent.';
    msg.className   = 'alert alert-success';
    msg.style.display = 'block';
    btn.textContent = 'Sent';
  } catch (ex) {
    msg.textContent   = 'Unable to reach the server. Please try again.';
    msg.className     = 'alert alert-error';
    msg.style.display = 'block';
    btn.disabled    = false;
    btn.textContent = 'Send Reset Link';
  }
});
</script>
{% endblock %}
