services:

  # ── Reverse proxy — routes all NMC domains on ${LAB_PORT:-9100}
  nginx:
    build: ./nginx
    ports:
      - "${LAB_PORT:-9100}:80"
    depends_on:
      - main-web
      - academy
      - admission
      - registrar
    networks:
      - nmc-school
    restart: unless-stopped

  # ── App 1: www.nmc.local (main website — Apache/PHP)
  main-web:
    build: ./main-web
    networks:
      - nmc-school
    restart: unless-stopped

  # ── App 2: academy.nmc.local (student/faculty portal — Node.js)
  academy:
    build: ./academy
    networks:
      - nmc-school
    restart: unless-stopped

  # ── App 3: admission.nmc.local (admission portal — Flask)
  admission:
    build: ./admission
    networks:
      - nmc-school
    restart: unless-stopped

  # ── App 4: registrar.nmc.local (registrar system — Apache/PHP)
  registrar:
    build: ./registrar
    networks:
      - nmc-school
    depends_on:
      registrar-db:
        condition: service_healthy
    restart: unless-stopped

  # ── Registrar database — MySQL 8 (pre-seeded)
  registrar-db:
    build: ./registrar-db
    environment:
      MYSQL_ROOT_PASSWORD: nmcroot2025
      MYSQL_DATABASE: nmc_registrar
    networks:
      - nmc-school
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pnmcroot2025"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Registrar staff bot — simulates staff reviewing pending requests
  registrar-bot:
    build: ./registrar-bot
    environment:
      REGISTRAR_URL: http://registrar:80
      BOT_USER: acruz
      BOT_PASS: staff2025
      BOT_INTERVAL: "45000"
    cap_add:
      - SYS_ADMIN
    depends_on:
      - registrar
    networks:
      - nmc-school
    restart: unless-stopped

networks:
  nmc-school:
    driver: bridge
