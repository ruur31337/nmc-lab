services:

  # ── Reverse proxy — routes all NMC domains on port 80
  nginx:
    image: ruur1337/nmc-nginx:latest
    container_name: nmc-nginx
    ports:
      - "80:80"
    depends_on:
      - main-web
      - academy
      - admission
      - registrar
    networks:
      - nmc-school
    restart: unless-stopped

  # ── App 1: www.nmc.local (main website — Apache/PHP)
  main-web:
    build: ./main-web
    image: ruur1337/nmc-main-web:latest
    container_name: nmc-main-web
    networks:
      - nmc-school
    restart: unless-stopped

  # ── App 2: academy.nmc.local (student/faculty portal — Node.js)
  academy:
    build: ./academy
    image: ruur1337/nmc-academy:latest
    container_name: nmc-academy
    networks:
      - nmc-school
    restart: unless-stopped

  # ── App 3: admission.nmc.local (admission portal — Flask)
  admission:
    image: ruur1337/nmc-admission:latest
    container_name: nmc-admission
    networks:
      - nmc-school
    restart: unless-stopped

  # ── App 4: registrar.nmc.local (registrar system — Apache/PHP)
  registrar:
    image: ruur1337/nmc-registrar:latest
    container_name: nmc-registrar
    networks:
      - nmc-school
    depends_on:
      registrar-db:
        condition: service_healthy
    restart: unless-stopped

  # ── Registrar database — MySQL 8 (pre-seeded)
  registrar-db:
    image: ruur1337/nmc-registrar-db:latest
    container_name: nmc-registrar-db
    environment:
      MYSQL_ROOT_PASSWORD: nmcroot2025
      MYSQL_DATABASE: nmc_registrar
    networks:
      - nmc-school
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pnmcroot2025"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Registrar staff bot — simulates staff reviewing pending requests
  registrar-bot:
    image: ruur1337/nmc-registrar-bot:latest
    container_name: nmc-registrar-bot
    environment:
      REGISTRAR_URL: http://nmc-registrar:80
      BOT_USER: acruz
      BOT_PASS: staff2025
      BOT_INTERVAL: "45000"
    cap_add:
      - SYS_ADMIN
    depends_on:
      - registrar
    networks:
      - nmc-school
    restart: unless-stopped

networks:
  nmc-school:
    driver: bridge
