; PHP Configuration — NMC Main Website
; Applied via Dockerfile COPY to /usr/local/etc/php/php.ini
;
; Upload and security settings for production deployment.
;
; @author  rdelacruz
; @date    2025-02-13

[PHP]

; ---- Upload settings ----
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 1
file_uploads = On

; ---- Error handling ----
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ---- Security hardening ----
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off

disable_functions = system,exec,passthru,shell_exec,proc_open,popen,pcntl_exec,phpinfo,show_source,highlight_file,file_get_contents,fopen,readfile

; ---- Session ----
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1
session.name = NMCSESSID

; ---- Misc ----
max_execution_time = 30
max_input_time = 60
memory_limit = 128M
date.timezone = Asia/Manila
