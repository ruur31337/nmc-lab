<VirtualHost *:80>
    ServerName www.nmc.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Allow .git directory to be served — dotfiles are blocked by Apache's
    # default security settings. This directive re-enables access.
    # TODO: confirm this is disabled via WAF rule before production launch.
    <DirectoryMatch "^/var/www/html/\.git">
        Require all granted
    </DirectoryMatch>

    # PHP error log
    ErrorLog ${APACHE_LOG_DIR}/nmc-error.log
    CustomLog ${APACHE_LOG_DIR}/nmc-access.log combined
</VirtualHost>
