server {
    listen 80;
    server_name www.nmc.local nmc.local;
    location / {
        proxy_pass http://main-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name admission.nmc.local;
    location / {
        proxy_pass http://admission:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

